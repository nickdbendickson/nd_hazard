name: CI

# Merge gate for the nd_* plugin suite.
#
# fast-checks   — the always-on HARD GATE: no QGIS/GDAL needed, fully deterministic, seconds to run.
#                 It proves every vendored damsuite copy still matches the shared pin
#                 (tools/damsuite_pin.json) - the single source both forks vendor from - with no
#                 checkout of the DWR_Plugins repo and no network; plus version sanity, py_compile
#                 of every source, and the fingerprint nested-VRT regression. Mark THIS job required
#                 in branch protection.
# plugin-suites — the fuller per-plugin test suites. These need QGIS/GDAL (and a scipy-compatible
#                 numpy), so the job provisions them via conda. A failing suite fails the run.
# model-tests   — the Runner's --models suite on the shipped LISFLOOD-FP and a conda ANUGA.
# All three should be required checks on main (see docs/CI.md, which also has the local recipe).

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run; every push to main still gets its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast checks (damsuite pin parity, versions, qt6 enums, compile)
        run: python3 tools/ci_checks.py
      - name: Fast-gate self-tests (qt6 enum lint)
        run: python3 tools/test_ci_checks.py
      - name: Fingerprint nested-VRT regression (QGIS-free)
        run: python3 ND_Dam_Hazard_Helper/tests/test_fingerprint_vrt.py

  plugin-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      - name: Plugin suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd "$GITHUB_WORKSPACE"
          fail=0
          # every step names its exit status, so a red job says which step it was (set +e: the
          # shell is bash -e, which would otherwise leave the loop at the first failure, unnamed)
          set +e
          trap 'echo "plugin-suites: leaving the step with status $? (fail=$fail)"' EXIT
          step() { "$@"; rc=$?; echo "-- exit status $rc: $*"; if [ $rc -ne 0 ]; then echo "::error::'$*' exited with status $rc"; fail=1; fi; }
          for p in ND_Dam_Hazard_Helper nd_breach_runner nd_data_updater; do
            echo "== $p =="
            step python -m "$p.tests.run_tests"
          done
          echo "== nd_dam_screening =="
          for t in nd_dam_screening/tests/test_*.py; do
            echo "-- $t --"
            step python "$t"
          done
          # opens every window offscreen and checks it against docs/gui-grammar.md
          echo "== gui_lint =="
          step python -X faulthandler tools/gui_lint.py
          exit $fail

  model-tests:
    # The Runner's --models suite: the fast tests plus every test that runs a real model, on
    # the LISFLOOD-FP the plugin ships (bin/linux-x64) and ANUGA in its own conda env, as on a
    # user's machine (NDBREACH_ANUGA_PYTHON).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Provision QGIS + a scipy-compatible numpy
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qgis
          create-args: >-
            python=3.12 qgis numpy<2 scipy gdal
      - name: ANUGA environment (conda-forge)
        run: |
          micromamba create -y -n anuga -c conda-forge python=3.12 anuga=4.0.1 scipy
          echo "NDBREACH_ANUGA_PYTHON=$(micromamba run -n anuga python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Runner model suite (LISFLOOD-FP + ANUGA)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x nd_breach_runner/bin/linux-x64/lisflood
          export NDBREACH_LISFLOOD="$GITHUB_WORKSPACE/nd_breach_runner/bin/linux-x64/lisflood"
          python -m nd_breach_runner.tests.run_tests --models
